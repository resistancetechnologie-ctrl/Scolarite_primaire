name: Build Android APK et Windows EXE

# Se declenche sur push/PR vers main, sur un tag de version (release),
# ou manuellement depuis l'onglet Actions de GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.7"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ #
  # ANDROID (.apk)
  # ------------------------------------------------------------------ #
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Completer le wrapper Gradle si absent
        # Le binaire gradle-wrapper.jar n'est pas committe, car les fichiers
        # binaires ne sont pas supportes dans ce depot. Pour eviter que
        # `flutter create` ecrase le squelette Android versionne (compileSdk,
        # namespace, applicationId, etc.), on genere un projet temporaire et
        # on copie uniquement le JAR du wrapper.
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar manquant : generation dans un projet temporaire..."
            tmp_dir="$(mktemp -d)"
            flutter create --platforms=android --org com.ecole --project-name ecole_primaire "$tmp_dir"
            cp "$tmp_dir/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            rm -rf "$tmp_dir"
          fi

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Analyse statique (informatif, ne bloque pas le build)
        run: flutter analyze
        continue-on-error: true

      - name: Construire l'APK (release)
        run: flutter build apk --release

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ecole-primaire-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # WINDOWS (.exe)
  # ------------------------------------------------------------------ #
  # ------------------------------------------------------------------ #
  # iOS (verification de build, non signe)
  # ------------------------------------------------------------------ #
  build-ios:
    name: Verifier le build iOS (non signe)
    runs-on: macos-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Construire (sans signature, verification uniquement)
        # Aucune IPA distribuable n'est produite ici (necessiterait un
        # certificat/profil de provisionnement Apple). Ce job confirme
        # seulement que le projet Xcode (ios/) compile correctement.
        run: flutter build ios --release --no-codesign

      - name: Publier le .app non signe comme artefact (verification)
        uses: actions/upload-artifact@v4
        with:
          name: ecole-primaire-ios-app-non-signe
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2022
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Activer le support desktop Windows
        run: flutter config --enable-windows-desktop

      - name: Generer le squelette Windows si absent
        # Le depot ne fournit aucun fichier "windows/" specifique a
        # personnaliser : on le genere entierement ici, sans risque
        # d'ecrasement puisque rien n'existe encore.
        shell: bash
        run: |
          if [ ! -d windows ]; then
            echo "Squelette Windows manquant : generation via 'flutter create'..."
            flutter create --platforms=windows --project-name ecole_primaire .
          fi

      - name: Recuperer les dependances
        run: flutter pub get

      - name: Diagnostiquer l'environnement Flutter et Visual Studio
        run: flutter doctor -v

      - name: Construire l'executable (release)
        run: flutter build windows --release

      - name: Preparer le dossier Windows portable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -File -Filter ecole_primaire.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) {
            throw "Executable Windows 'ecole_primaire.exe' introuvable sous build/windows/**/Release"
          }

          $releaseDir = $exe.Directory
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item -Path "$($releaseDir.FullName)/*" -Destination dist/windows -Recurse -Force

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur Windows (.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path windows/runner/resources/app_icon.ico)) {
            throw "Icone Inno Setup introuvable : windows/runner/resources/app_icon.ico"
          }
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          @'
          [Setup]
          AppId={{EcolePrimaireGestionScolaire}}
          AppName=Ecole Primaire
          AppVersion=1.0.0
          AppPublisher=Ecole Primaire
          DefaultDirName={autopf}\Ecole Primaire
          DefaultGroupName=Ecole Primaire
          OutputDir=dist\installer
          OutputBaseFilename=ecole_primaire-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\ecole_primaire.exe

          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Creer une icone sur le Bureau"; GroupDescription: "Icones supplementaires :"

          [Files]
          Source: "dist\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Ecole Primaire"; Filename: "{app}\ecole_primaire.exe"
          Name: "{commondesktop}\Ecole Primaire"; Filename: "{app}\ecole_primaire.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\ecole_primaire.exe"; Description: "Lancer Ecole Primaire"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path dist/installer/ecole_primaire-setup.exe)) {
            throw "Installateur Windows 'ecole_primaire-setup.exe' non genere"
          }

      - name: Compresser l'executable portable et l'installateur
        shell: pwsh
        run: |
          Compress-Archive -Path dist/windows/*, dist/installer/ecole_primaire-setup.exe -DestinationPath ecole_primaire-windows.zip

      - name: Publier le ZIP Windows comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ecole-primaire-windows-zip
          path: ecole_primaire-windows.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # RELEASE GITHUB (uniquement sur un tag "vX.Y.Z")
  # ------------------------------------------------------------------ #
  release:
    name: Publier la release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger les artefacts
        uses: actions/download-artifact@v4

      - name: Creer/mettre a jour la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ecole-primaire-android-apk/app-release.apk
            ecole-primaire-windows-zip/ecole_primaire-windows.zip
